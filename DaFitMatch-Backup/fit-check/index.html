<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LTX — The world model</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    
    button {
      font-family: 'Manrope', system-ui, sans-serif;
    }

    ::selection { background: rgba(255,255,255,0.2); }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      position: absolute;
      top: 35.9%;
      left: 50%;
      transform: translateX(-50%);
      width: min(901px, calc(100vw - 48px));
      font-size: clamp(62px, 6.8vw, 100px);
      font-weight: 500;
      line-height: 0.8;
      letter-spacing: -0.04em;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
      margin: 0;
    }

    h1 span {
      display: inline-block;
      transition: opacity 900ms var(--retake-ease), filter 900ms var(--retake-ease), transform 900ms var(--retake-ease);
    }
    h1 span:nth-child(1) { transition-delay: 0ms; }
    h1 span:nth-child(2) { transition-delay: 90ms; }
    h1 span:nth-child(3) { transition-delay: 180ms; }

    .stage.title-hidden h1 span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-10px);
    }

    p {
      position: absolute;
      top: calc(46.78% + 94px);
      left: 50%;
      transform: translateX(-50%);
      width: min(734px, calc(100vw - 48px));
      font-size: clamp(14px, 1.25vw, 18px);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
      margin: 0;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      position: absolute;
      top: 0;
      width: 100%;
      padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
      text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
      z-index: 30;
    }

    header a { color: inherit; text-decoration: none; display: flex; align-items: center; }
    header svg { height: 24px; width: auto; fill: #fff; }

    .meta {
      margin-left: clamp(48px, 5vw, 70px);
      display: flex;
      gap: clamp(28px, 3vw, 44px);
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .try-btn {
      width: 152px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / 0.75);
      background: transparent;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 300ms, background 300ms, border-color 300ms;
    }
    .try-btn:hover, .try-btn:focus-visible {
      background: #fff;
      color: #0b1a26;
    }

    .controller {
      position: absolute;
      top: 46.78%;
      left: 50%;
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 48px));
      height: 72px;
      z-index: 20;
      --hover-left: -5px;
      --hover-width: calc(20% + 5px);
      --glass-x: 24%;
      --glass-y: 8%;
    }

    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 14px;
      font-size: 23px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
      color: #fff;
      background: transparent;
      border: 0;
      margin: 0;
      transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
    }
    button.cell {
      border-radius: 999px;
      cursor: pointer;
    }
    button.cell:disabled {
      cursor: default;
    }

    .controller.hovered .label-cell:not(.faded-out) {
      opacity: 0.5;
      transition: opacity 300ms;
    }
    
    .controller.collapsed .cell.faded-out {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.94);
      pointer-events: none;
    }

    .controller.restoring .cell:not(.selected) {
      transition: opacity 760ms var(--retake-ease) 60ms, filter 760ms var(--retake-ease) 60ms, transform 980ms var(--retake-slow-ease);
    }

    .track {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      background: rgb(24 55 82 / 0.31);
      border: 1px solid rgb(255 255 255 / 0.2);
      backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      box-shadow: 0 14px 38px rgb(4 24 43 / 0.16), 0 2px 7px rgb(4 24 43 / 0.1), inset 1px 1px 0 rgb(255 255 255 / 0.48), inset -1px -1px 0 rgb(21 49 73 / 0.14), inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
      transition: opacity 400ms linear, left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease);
    }

    .capsule, .target-measurer {
      position: absolute;
      top: -1px;
      left: var(--hover-left);
      width: var(--hover-width);
      height: 72px;
      border-radius: 999px;
      background: rgb(246 251 255 / 0.24);
      border: 1px solid rgb(255 255 255 / 0.28);
      backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      box-shadow: 0 11px 28px rgb(4 24 43 / 0.17), 0 2px 6px rgb(4 24 43 / 0.1), inset 1px 1px 0 rgb(255 255 255 / 0.62), inset -1px -1px 0 rgb(20 49 73 / 0.18), inset 0 0 12px rgb(255 255 255 / 0.055);
      transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease), background 980ms var(--retake-slow-ease);
    }

    .track::before, .track::after, .capsule::before, .capsule::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    .track::before, .capsule::before {
      background: radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%), rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%), linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
    }
    .track::after, .capsule::after {
      padding: 1px;
      background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff, #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .track::after { opacity: 0.27; }
    .capsule::after { opacity: 0.30; }

    /* Target Measurer Setup (Hidden) */
    .target-measurer {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      z-index: -1;
      left: calc(50% - 100px) !important;
      width: 200px !important;
    }

    /* Collapsed state overrides */
    .controller.collapsed .track {
      left: calc(50% - 96px);
      width: 192px;
    }
    .controller.collapsed .track.hidden {
      opacity: 0;
      transition: opacity 400ms linear 650ms, left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease);
    }
    .controller.collapsed .capsule {
      left: calc(50% - 100px);
      width: 200px;
      background: rgb(246 251 255 / 0.14);
    }

    @keyframes resetReveal {
      from { opacity: 0; filter: blur(10px); }
      to { opacity: 1; filter: blur(0); }
    }
    @keyframes resetFadeOut {
      from { opacity: 1; filter: blur(0); }
      to { opacity: 0; filter: blur(10px); }
    }
    @keyframes labelFadeIn {
      from { opacity: 0; filter: blur(10px); }
      to { opacity: 1; filter: blur(0); }
    }

    /* Responsive Queries */
    @media (max-width: 900px) {
      header { padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
      .meta { font-size: 14px; gap: 22px; margin-left: 34px; }
      .try-btn { width: 116px; height: 36px; font-size: 14px; }
      .cell { font-size: clamp(17px, 2.5vw, 24px); }
    }

    @media (max-width: 700px) {
      header { padding-left: 18px; padding-right: 18px; }
      header svg { height: 21px; }
      .meta { font-size: 12px; }
      .meta span:nth-child(2) { display: none; }
      
      .try-btn { width: 92px; height: 34px; font-size: 13px; }
      .try-btn::after { content: ''; position: absolute; inset: -6px -10px; }
      
      h1 { top: 34%; width: calc(100vw - 40px); font-size: clamp(48px, 14vw, 64px); line-height: 0.88; white-space: normal; }
      p { top: 77%; width: calc(100vw - 44px); font-size: 14px; }
      
      .controller { top: 53%; width: calc(100vw - 40px); height: 156px; }
      .track { top: 0; height: 156px; border-radius: 28px; }
      
      .cells { grid-template-columns: 1fr 1fr; grid-template-rows: 48px 54px 54px; }
      .label-cell { grid-column: 1 / -1; }
      
      .cell:nth-child(1) { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
      .cell:nth-child(2), .cell:nth-child(3) { border-bottom: 1px solid rgb(255 255 255 / 0.12); }
      .cell:nth-child(2), .cell:nth-child(4) { border-right: 1px solid rgb(255 255 255 / 0.12); }
      
      .cell { font-size: 17px; }
      
      /* Disable sliding hover capsule on mobile */
      .capsule { opacity: 0; pointer-events: none; transition: none; }
      .cell:active, .cell:focus-visible { outline-offset: -3px; }
      
      /* Mobile Collapsed Capsule */
      .controller.collapsed .capsule, .target-measurer {
        opacity: 1 !important;
        left: 50% !important;
        top: 4vh !important;
        top: 4dvh !important;
        transform: translate(-50%, -50%) !important;
        width: 196px !important;
        height: 64px !important;
        border-radius: 999px !important;
        background: rgb(246 251 255 / 0.18) !important;
      }
    }

    @media (max-width: 700px) and (max-height: 700px) {
      .controller { top: 50%; }
      p { top: calc(50% + 168px); width: calc(100vw - 32px); font-size: 13px; }
    }
    
    @media (max-height: 520px) and (orientation: landscape) {
      h1 { top: 20%; font-size: clamp(34px, 8vh, 56px); }
      .controller { top: 50%; }
      p { top: auto; bottom: 8px; font-size: 13px; }
    }
    
    @media (max-width: 700px) and (max-height: 520px) and (orientation: landscape) {
      h1 { top: 12%; font-size: clamp(28px, 7vh, 44px); }
      .controller { top: 46%; height: 118px; }
      .track { height: 118px; }
      .cells { grid-template-rows: 36px 41px 41px; }
      .cell { font-size: 15px; }
      p { bottom: 6px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .capsule, .track, .cell, h1 span, .try-btn, .stage.title-hidden h1 span {
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
      }
      .track, .capsule, .stage.title-hidden h1 span {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        filter: none !important;
      }
    }

    
  </style>
</head>
<body>
<div class="stage">
    
    <!-- Base / Clothing FWD -->
    <video id="vid-clothing-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Clothing REV -->
    <video id="vid-clothing-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Scene FWD -->
    <video id="vid-scene-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Scene REV -->
    <video id="vid-scene-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Lighting FWD -->
    <video id="vid-light-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Lighting REV -->
    <video id="vid-light-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Cast FWD -->
    <video id="vid-cast-fwd" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>
    <!-- Cast REV -->
    <video id="vid-cast-rev" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true" class="media"></video>

    <div class="hero">
      <h1><span>The</span> <span>world</span> <span>model</span></h1>
      <p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p>
    </div>

    <div class="controller" role="group" aria-label="Scene state controller">
      <div class="track"></div>
      <div class="capsule"></div>
      <div class="capsule target-measurer"></div>
      
      <div class="cells">
        <div class="cell label-cell" aria-hidden="true">Select state &rarr;</div>
        <button class="cell option-btn" data-id="scene" disabled aria-hidden="true" tabindex="-1">Scene</button>
        <button class="cell option-btn" data-id="light" disabled aria-hidden="true" tabindex="-1">Lighting</button>
        <button class="cell option-btn" data-id="clothing" disabled aria-hidden="true" tabindex="-1">Clothing</button>
        <button class="cell option-btn" data-id="cast" disabled aria-hidden="true" tabindex="-1">Cast</button>
      </div>
    </div>

    <header>
      <div class="meta" style="margin-left: 0; font-size: 36px; font-weight: 700; letter-spacing: -0.06em; text-transform: uppercase; display: flex; align-items: center;">
        <span>The Fit Check</span>
      </div>
      <div></div>
      <a href="https://app.ltx.io/" target="_blank" rel="noopener noreferrer" class="try-btn">Try now</a>
    </header>

    <div id="a11y-status" class="visually-hidden" aria-live="polite"></div>

  </div>

  <script>
    const controller = document.querySelector('.controller');
    const cells = document.querySelectorAll('.cell');
    const baseVid = document.getElementById('vid-clothing-fwd');
    const a11yStatus = document.getElementById('a11y-status');
    const stage = document.querySelector('.stage');
    
    let currentState = 'base'; // base, forward, selected, reverse, error
    let activeId = null;
    let transitionToken = 0;
    let isLocked = false;
    let activeVid = baseVid;
    let currentBtn = null;
    let originalText = '';
    let lastFocusedBtn = null;
    let currentDx = 0, currentDy = 0;

    const clipPairs = {
      scene: { fwd: 'vid-scene-fwd', rev: 'vid-scene-rev' },
      light: { fwd: 'vid-light-fwd', rev: 'vid-light-rev' },
      clothing: { fwd: 'vid-clothing-fwd', rev: 'vid-clothing-rev' },
      cast: { fwd: 'vid-cast-fwd', rev: 'vid-cast-rev' }
    };

    function announce(msg) {
      a11yStatus.textContent = msg;
    }

    // Glass Hover & Focus tracking
    controller.addEventListener('mousemove', e => {
      const rect = controller.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 100;
      const y = ((e.clientY - rect.top) / rect.height) * 100;
      controller.style.setProperty('--glass-x', `${x}%`);
      controller.style.setProperty('--glass-y', `${y}%`);
    });

    const positions = [
      { left: '-5px', width: 'calc(20% + 5px)' },
      { left: '20%', width: '20%' },
      { left: '40%', width: '20%' },
      { left: '60%', width: '20%' },
      { left: '80%', width: 'calc(20% + 5px)' }
    ];

    function setCapsule(index) {
      if (controller.classList.contains('collapsed')) return;
      controller.style.setProperty('--hover-left', positions[index].left);
      controller.style.setProperty('--hover-width', positions[index].width);
      controller.classList.add('hovered');
    }

    function resetCapsule() {
      if (controller.classList.contains('collapsed')) return;
      const focusedIndex = Array.from(cells).findIndex(c => c === document.activeElement);
      if (focusedIndex > 0) {
        setCapsule(focusedIndex);
        return;
      }
      controller.style.setProperty('--hover-left', positions[0].left);
      controller.style.setProperty('--hover-width', positions[0].width);
      controller.classList.remove('hovered');
    }

    cells.forEach((cell, index) => {
      if (index === 0) return;
      cell.addEventListener('mouseenter', () => setCapsule(index));
      cell.addEventListener('focus', () => setCapsule(index));
      cell.addEventListener('mouseleave', () => resetCapsule());
      cell.addEventListener('blur', () => resetCapsule());
    });

    // Initialize Base Video
    if (baseVid.readyState >= 2) {
      baseVid.style.visibility = 'visible';
    } else {
      baseVid.addEventListener('loadeddata', () => {
        baseVid.style.visibility = 'visible';
      }, {once: true});
    }

    // Readiness Tracking
    let readyCount = 0;
    const totalVideos = 8;
    function checkInitialReady() {
      readyCount++;
      if (readyCount === totalVideos) {
        announce('All scenes ready. Choose an option.');
      }
    }

    Object.entries(clipPairs).forEach(([id, pair]) => {
      const vFwd = document.getElementById(pair.fwd);
      const vRev = document.getElementById(pair.rev);
      const btn = document.querySelector(`button[data-id="${id}"]`);
      
      let fwdReady = false;
      let revReady = false;
      
      const checkPair = () => {
        if (fwdReady && revReady && (currentState === 'base' || currentState === 'error') && !isLocked) {
          btn.disabled = false;
          btn.removeAttribute('aria-hidden');
          btn.tabIndex = 0;
        }
      };
      
      if (vFwd.readyState >= 2) { fwdReady = true; checkInitialReady(); }
      else { vFwd.addEventListener('loadeddata', () => { fwdReady = true; checkInitialReady(); checkPair(); }, {once: true}); }
      
      if (vRev.readyState >= 2) { revReady = true; checkInitialReady(); }
      else { vRev.addEventListener('loadeddata', () => { revReady = true; checkInitialReady(); checkPair(); }, {once: true}); }
      
      checkPair();
    });

    // Seam-safe playback wrapper
    function playWithTimeout(video, holdTime, token) {
      return new Promise((resolve, reject) => {
        let timeoutId;
        let startTime = performance.now();
        let timeElapsed = 0;
        const TOTAL_TIMEOUT = 12000;
        let isActive = true;

        const clearAll = () => {
          isActive = false;
          clearTimeout(timeoutId);
          document.removeEventListener('visibilitychange', onVisChange);
        };

        const tickTimeout = () => {
          if (!isActive) return;
          if (document.hidden) return;
          const now = performance.now();
          timeElapsed += (now - startTime);
          startTime = now;
          if (timeElapsed > TOTAL_TIMEOUT) {
            clearAll();
            reject(new Error('timeout'));
          } else {
            timeoutId = setTimeout(tickTimeout, 500);
          }
        };

        const onVisChange = () => {
          if (!isActive) return;
          if (document.hidden) {
            clearTimeout(timeoutId);
            video.pause();
            video.currentTime = 0;
          } else {
            startTime = performance.now();
            timeoutId = setTimeout(tickTimeout, 500);
            video.play().catch(()=>{});
          }
        };
        
        document.addEventListener('visibilitychange', onVisChange);
        timeoutId = setTimeout(tickTimeout, 500);

        playClipInner(video, holdTime, token).then(() => {
          clearAll();
          resolve();
        }).catch(err => {
          clearAll();
          reject(err);
        });
      });
    }

    function playClipInner(video, holdTime, token) {
      return new Promise((resolve, reject) => {
        if (token !== transitionToken) return reject(new Error('stale'));
        
        const onEnd = () => {
          if (token !== transitionToken) return;
          video.pause();
          resolve();
        };

        const startPlayback = async () => {
          try {
            if (video.currentTime > 0.001) {
              await new Promise(r => {
                const onSeeked = () => { video.removeEventListener('seeked', onSeeked); r(); };
                video.addEventListener('seeked', onSeeked);
                video.currentTime = 0;
              });
            }
            if (token !== transitionToken) throw new Error('stale');

            const playPromise = video.play();
            const framePromise = new Promise((resolveFrame, rejectFrame) => {
              if ('requestVideoFrameCallback' in video) {
                const callback = (now, metadata) => {
                  if (token !== transitionToken) return rejectFrame(new Error('stale'));
                  if (metadata.mediaTime <= 0.5 && video.readyState >= 2) {
                    resolveFrame();
                  } else {
                    video.requestVideoFrameCallback(callback);
                  }
                };
                video.requestVideoFrameCallback(callback);
              } else {
                const check = () => {
                  if (token !== transitionToken) return rejectFrame(new Error('stale'));
                  if (video.readyState >= 2 && !video.paused) {
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                      if (token !== transitionToken) return rejectFrame(new Error('stale'));
                      resolveFrame();
                    }));
                  } else {
                    requestAnimationFrame(check);
                  }
                };
                video.addEventListener('playing', check, {once: true});
              }
            });

            await Promise.all([playPromise, framePromise]);
            if (token !== transitionToken) throw new Error('stale');
            
            if (activeVid !== video) {
              activeVid.style.visibility = 'hidden';
              video.style.visibility = 'visible';
              activeVid = video;
            }

            const checkHold = () => {
              if (token !== transitionToken) return;
              if (video.currentTime >= video.duration - holdTime) {
                onEnd();
              } else {
                requestAnimationFrame(checkHold);
              }
            };
            requestAnimationFrame(checkHold);
            video.addEventListener('ended', onEnd, {once: true});

          } catch (err) {
            reject(err);
          }
        };
        startPlayback();
      });
    }

    function handleError(btn, dx, dy, origText, e) {
      console.error('Transition error:', e);
      isLocked = false;
      currentState = 'error';
      btn.innerHTML = 'Retry';
      btn.disabled = false;
      btn.removeAttribute('aria-hidden');
      btn.tabIndex = 0;
      announce('Error occurred. Press to retry.');
    }

    function calculateDxDy(btnElement) {
      const measurer = document.querySelector('.target-measurer').getBoundingClientRect();
      const targetCx = measurer.left + measurer.width / 2;
      const targetCy = measurer.top + measurer.height / 2;
      
      const btnRect = btnElement.getBoundingClientRect();
      const btnCx = btnRect.left + btnRect.width / 2;
      const btnCy = btnRect.top + btnRect.height / 2;
      
      return { dx: targetCx - btnCx, dy: targetCy - btnCy };
    }

    // Keep centered on resize
    window.addEventListener('resize', () => {
      if (currentBtn && (currentState === 'selected' || currentState === 'forward' || currentState === 'error')) {
        currentBtn.style.transform = 'none';
        const { dx, dy } = calculateDxDy(currentBtn);
        currentDx = dx; currentDy = dy;
        currentBtn.style.transform = `translate(${dx}px, ${dy}px)`;
      }
    });

    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        if (isLocked) return;

        document.querySelectorAll('.option-btn').forEach(b => {
          if (b === document.activeElement) {
            lastFocusedBtn = b;
          }
          b.disabled = true;
          b.setAttribute('aria-hidden', 'true');
          b.tabIndex = -1;
        });

        transitionToken++;
        const token = transitionToken;
        isLocked = true;
        announce('Transitioning...');

        if (currentState === 'base' || currentState === 'error') {
          if (currentState === 'base') {
            activeId = btn.dataset.id;
            currentBtn = btn;
            originalText = btn.textContent;
          }
          currentState = 'forward';
          
          if (!controller.classList.contains('collapsed')) {
            controller.classList.add('collapsed');
            document.querySelector('.track').classList.add('hidden');
            
            document.querySelectorAll('.cell').forEach(c => {
              if (c !== btn) c.classList.add('faded-out');
            });
          }

          const { dx, dy } = calculateDxDy(btn);
          currentDx = dx; currentDy = dy;
          btn.style.transform = `translate(${dx}px, ${dy}px)`;

          const fwdVid = document.getElementById(clipPairs[activeId].fwd);
          const hideDelay = Math.min(fwdVid.duration * 0.12, 0.9) * 1000;
          setTimeout(() => {
            if (token === transitionToken) {
              stage.classList.add('title-hidden');
            }
          }, hideDelay);

          try {
            await playWithTimeout(fwdVid, 0.08, token);
            if (token !== transitionToken) return;
            
            currentState = 'selected';
            isLocked = false;
            
            btn.innerHTML = `<span class="reset-reveal" style="display:inline-block; animation: resetReveal 520ms var(--retake-ease) forwards; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;">Reset</span>`;
            btn.disabled = false;
            btn.removeAttribute('aria-hidden');
            btn.tabIndex = 0;
            
            if (lastFocusedBtn === btn) {
              btn.focus({ preventScroll: true });
            }
            
            announce(`Selected ${activeId}. Press to reset.`);

          } catch (e) {
            if (token !== transitionToken) return;
            handleError(btn, currentDx, currentDy, originalText, e);
          }

        } else if (currentState === 'selected') {
          currentState = 'reverse';
          
          btn.innerHTML = `
            <span style="position:absolute; animation: resetFadeOut 980ms var(--retake-ease) forwards;">Reset</span>
            <span style="opacity:0; animation: labelFadeIn 760ms var(--retake-ease) 60ms forwards;">${originalText}</span>
          `;
          
          controller.classList.remove('collapsed');
          controller.classList.add('restoring');
          document.querySelector('.track').classList.remove('hidden');
          
          btn.style.transform = `none`;
          resetCapsule();
          
          document.querySelectorAll('.cell.faded-out').forEach(c => c.classList.remove('faded-out'));

          setTimeout(() => {
            if (token === transitionToken) {
              btn.innerHTML = originalText;
              controller.classList.remove('restoring');
            }
          }, 1200);

          const revVid = document.getElementById(clipPairs[activeId].rev);
          const holdTime = activeId === 'scene' ? 0.18 : 0.08;
          
          try {
            await playWithTimeout(revVid, holdTime, token);
            if (token !== transitionToken) return;
            
            stage.classList.remove('title-hidden');
            
            currentState = 'base';
            isLocked = false;
            currentBtn = null;
            
            document.querySelectorAll('.option-btn').forEach(b => {
              b.disabled = false;
              b.removeAttribute('aria-hidden');
              b.tabIndex = 0;
            });
            
            if (lastFocusedBtn === btn) {
              btn.focus({ preventScroll: true });
            }
            announce('Returned to base scene.');
            
          } catch (e) {
            if (token !== transitionToken) return;
            handleError(btn, 0, 0, originalText, e);
          }
        }
      });
    });
  </script>
</body>
</html>
